spring:
  datasource:
    url: jdbc:h2:mem:ejib_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  issuer: ejib-test
  secret: test-jwt-secret-must-be-at-least-32-bytes
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600

cloudinary:
  cloud-name: test-cloud
  api-key: test-key
  api-secret: test-secret

google:
  cloud:
    vision:
      credentials:
        location: file:./secrets/google-vision.json
  gemini:
    api-key: test-gemini-key
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent

kakao:
  oauth:
    client-id: test-kakao-client-id
    client-secret:
    redirect-uri: http://localhost:8080/oauth/kakao/callback
    frontend-success-uri: http://localhost:3000/oauth/kakao/success
    frontend-failure-uri: http://localhost:3000/login
    state-cookie-secure: false