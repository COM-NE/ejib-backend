spring:
  application:
    name: ejib
  profiles:
    default: dev

  lifecycle:
    timeout-per-shutdown-phase: 30s

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  tomcat:
    connection-timeout: 5s
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    db:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ejib

jwt:
  issuer: ${JWT_ISSUER:ejib-api}
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

google:
  cloud:
    vision:
      credentials:
        location: ${VISION_KEY}
  gemini:
    api-key: ${GEMINI_API_KEY}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent

cloudinary:
  cloud-name: ${CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_KEY}
  api-secret: ${CLOUDINARY_SECRET}

kakao:
  oauth:
    client-id: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    authorize-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/oauth/kakao/callback}
    frontend-success-uri: ${KAKAO_FRONTEND_SUCCESS_URI:http://localhost:3000/oauth/kakao/success}
    frontend-failure-uri: ${KAKAO_FRONTEND_FAILURE_URI:http://localhost:3000/login}
    state-cookie-secure: ${KAKAO_STATE_COOKIE_SECURE:true}
    state-expiration-seconds: ${KAKAO_STATE_EXPIRATION_SECONDS:300}
    login-ticket-expiration-seconds: ${KAKAO_LOGIN_TICKET_EXPIRATION_SECONDS:180}
