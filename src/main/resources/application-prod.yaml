spring:
  datasource:
    url: ${EJIB_DB_URL}
    username: ${EJIB_DB_USERNAME}
    password: ${EJIB_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}