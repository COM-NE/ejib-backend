spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ejib_db
    username: ${EJIB_DB_USERNAME}
    password: ${EJIB_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}

kakao:
  oauth:
    state-cookie-secure: false