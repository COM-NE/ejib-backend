services:
  app:
    image: ${IMAGE_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: ejib-api
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      VISION_KEY: file:/run/secrets/google_vision_key

    ports:
      # 외부에는 8080을 공개하지 않고, 같은 EC2의 Nginx만 접근합니다.
      - "127.0.0.1:8080:8080"

    secrets:
      - google_vision_key

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 70s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  google_vision_key:
    file: ./secrets/google-vision.json
