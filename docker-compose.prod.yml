services:
  app:
    container_name: ejib-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      VISION_KEY: file:/run/secrets/google_vision_key
    ports:
      # 같은 EC2의 Nginx만 127.0.0.1:8080으로 접근 가능
      - "127.0.0.1:8080:8080"
    secrets:
      - google_vision_key
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 70s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  google_vision_key:
    file: ./secrets/google-vision.json
