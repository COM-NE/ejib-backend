services:
  mysql:
    image: mysql:8.4
    container_name: ejib-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ejib_db}
      MYSQL_USER: ${MYSQL_USER:-ejib}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ejib_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ejib_root_password}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ejib-backend:local
    container_name: ejib-api-local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EJIB_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ejib_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      VISION_KEY: file:/run/secrets/google_vision_key
    ports:
      - "8080:8080"
    secrets:
      - google_vision_key

volumes:
  mysql_data:

secrets:
  google_vision_key:
    file: ./secrets/google-vision.json
